[workspace]
members = [
    "crates/nvidia-dlss",
    "crates/nvidia-nrd",
    "crates/nvidia-omm",
    "crates/nvidia-sdk",
    "crates/nvidia-streamline",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/attackgoat/nvidia"
homepage = "https://github.com/attackgoat/nvidia"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["tls"] }
vk-graph = "0.14.7"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
