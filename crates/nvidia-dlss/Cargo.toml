[package]
name = "nvidia-dlss"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nvidia-dlss"
description = "Vulkan bindings for NVIDIA DLSS Ray Reconstruction through NGX"
build = "build.rs"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["dlss-release-runtime", "vk-graph"]
dlss-release-runtime = []
vk-graph = ["dep:vk-graph"]

[dependencies]
anyhow = "1.0"
ash = { version = "0.38", default-features = false }
vk-graph = { workspace = true, optional = true }

[build-dependencies]
cc = "1.2"
nvidia-sdk = { version = "0.1.0", path = "../nvidia-sdk" }

[lints]
workspace = true
