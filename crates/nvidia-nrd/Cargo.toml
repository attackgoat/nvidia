[package]
name = "nvidia-nrd"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nvidia-nrd"
description = "NVIDIA NRD RELAX SH Vulkan integration"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["native", "vk-graph"]
native = []
vk-graph = ["dep:vk-graph"]

[dependencies]
anyhow.workspace = true
ash = { version = "0.38", default-features = false }
log.workspace = true
vk-graph = { workspace = true, optional = true }

[build-dependencies]
cmake = "0.1"
dunce = "1"
nvidia-sdk = { version = "0.1.0", path = "../nvidia-sdk" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
